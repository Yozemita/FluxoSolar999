name: application-checks
on:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: solar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fluxosolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solar -d fluxosolar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://solar:ci-only-password@127.0.0.1:5432/fluxosolar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pip check
      - run: node --check backend/static/app.js
      - run: docker build -t fluxosolar:ci .
      - run: docker build -t fluxosolar:ci-backend backend
      - run: python scripts/check_image.py --image fluxosolar:ci --legacy-start
      - run: python scripts/check_image.py --image fluxosolar:ci-backend --legacy-start
